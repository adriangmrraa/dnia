[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

# Estrategia de test local: surfpool EMBEBIDO (npm @solana/surfpool) levantado
# dentro del before() de mocha — ver tests/helpers/surfnet.ts.
#
# ¿Por qué no `solana-test-validator` / `--validator legacy`? Este entorno es
# WSL1: su emulación de sockets no implementa SO_REUSEPORT y el gossip del
# validator muere en `multi_bind` con EADDRINUSE. En Windows nativo el
# binario solana-test-validator.exe muere con Os { code: 1314 } (privilegio).
# El fallback documentado en test-plan.md se resuelve así: mismo runtime SVM
# (LiteSVM), JSON-RPC real para web3.js, deploy de .so por ruta (incluye el
# fixture SAS en S2) y cheatcodes deterministas (fundSol/timeTravel).
#
# Por eso `npm test` = `anchor test --skip-local-validator --skip-deploy`:
# anchor build sigue corriendo, pero ni se levanta validator ni se hace
# `anchor deploy` — el surfnet carga target/deploy/*.so en before().
#
# S2 agrega el deploy del fixture SAS (tests/fixtures/sas.so) en el harness.
